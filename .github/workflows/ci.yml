name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:engine

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:engine
      - run: npm run package:win
      - run: npm run package:binary-zip
      - run: npm run audit:binary-zip
      - uses: actions/upload-artifact@v4
        with:
          name: EveJS-Character-Transfer-windows-x64
          path: dist/EveJS-Character-Transfer-v0.2.0.zip
          if-no-files-found: error
          retention-days: 14
